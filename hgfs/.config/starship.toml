# ~/.config/starship.toml
#
# Powerlevel10k-inspired Starship configuration
# Catppuccin palette

add_newline = true
command_timeout = 1000
scan_timeout = 30

palette = "ibm"

# ============================================================
# FORMAT
# ============================================================

format = """
[╭─](bold blue)\
$username\
$hostname\
$os\
$shell\
[](bold blue)\
$directory\
$git_branch\
$git_status\
$git_state\
$git_metrics\
$fill\
$docker_context\
$kubernetes\
$python\
$nodejs\
$rust\
$golang\
$java\
$package\
$memory_usage\
$cmd_duration\
$line_break\
[╰─](bold blue)\
$jobs\
$status\
$character"""

# ============================================================
# PALETTE
# ============================================================

[palettes.ibm]
rosewater = "#ffffff"
flamingo = "#FF70F7"
pink = "#FF10F0"
mauve = "#a360a3"
red = "#d24646"
maroon = "#e99999"
peach = "#b4b47b"
yellow = "#dadaba"
green = "#66a773"
teal = "#a360a3"
sky = "#c296c2"
sapphire = "#727272"
blue = "#adadad"
lavender = "#FF70F7"
text = "#ffffff"
surface = "#050709"

# ============================================================
# PROMPT CHARACTER
# ============================================================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"

# ============================================================
# DIRECTORY
# ============================================================

[directory]
style = "bold blue"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold red"

# ============================================================
# GIT
# ============================================================

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style))"

conflicted = "⚔️ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count} ⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "󰏗 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold red"
format = "[$state( $progress_current/$progress_total)]($style) "

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) [-$deleted]($deleted_style)) "

# ============================================================
# USER / HOST
# ============================================================

[username]
show_always = true
style_user = "bold lavender"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold green"
format = "[@$hostname]($style)"

# ============================================================
# OS
# ============================================================

[os]
disabled = false
style = "bold sky"
format = "[$symbol]($style) "

[os.symbols]
Arch = " "
Ubuntu = "󰕈"
Fedora = "󰣛"
Macos = "󰀵"
Windows = "󰍲"

# ============================================================
# SHELL
# ============================================================

[shell]
disabled = false
style = "bold peach"
format = "[$indicator]($style) "

bash_indicator = "󱆃"
zsh_indicator = " "
fish_indicator = " "
unknown_indicator = "?"

# ============================================================
# FILL
# ============================================================

[fill]
symbol = " "

# ============================================================
# RUNTIMES
# ============================================================

[python]
symbol = ""
style = "bold yellow"
format = "[$symbol$version( $virtualenv)]($style) "

[nodejs]
symbol = "󰎙"
style = "bold green"
format = "[$symbol$version]($style) "

[rust]
symbol = ""
style = "bold red"
format = "[$symbol$version]($style) "

[dotnet]
symbol = "󰪮 "
style = "bold teal"
format = "[$symbol$version]($style)"

[java]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[package]
symbol = " "
style = "bold peach"
format = "[$symbol$version]($style) "

# ============================================================
# CONTAINERS / K8S
# ============================================================

[docker_context]
symbol = "󰡨"
style = "bold blue"
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold mauve"
format = "[$symbol$context( \\($namespace\\))]($style) "

# ============================================================
# MEMORY
# ============================================================

[memory_usage]
disabled = false
threshold = 75
symbol = " "
style = "bold red"
format = "[$symbol$ram_pct]($style) "

# ============================================================
# COMMAND DURATION
# ============================================================

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[󱎫 $duration]($style) "

# ============================================================
# JOBS
# ============================================================

[jobs]
symbol = "✦ "
style = "bold cyan"
number_threshold = 1
format = "[$symbol$number]($style) "

# ============================================================
# EXIT STATUS
# ============================================================

[status]
disabled = false
symbol = "✘ "
success_symbol = ""
style = "bold red"
format = "[$symbol$status]($style) "

# ============================================================
# SUDO
# ============================================================

[sudo]
disabled = false
symbol = "󰌋 "
style = "bold red"
format = "[$symbol]($style)"
